      <stop offset="0.55" stop-color="#39AFFF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#003875" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001538" flood-opacity="0.48"/>
    </filter>
    <filter id="innerDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0A4E91" flood-opacity="0.3"/>
    </filter>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="1024" height="1024" rx="145" ry="145"/>
    </clipPath>
  </defs>

