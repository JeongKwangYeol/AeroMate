<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="AeroMate app icon">
  <defs>
    <linearGradient id="bg" x1="135" y1="30" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFEFFF"/>
      <stop offset="0.34" stop-color="#72C9F7"/>
      <stop offset="0.72" stop-color="#2298F3"/>
      <stop offset="1" stop-color="#0578E8"/>
    </linearGradient>
    <radialGradient id="shine" cx="260" cy="110" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.58"/>
      <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planeGrad" x1="330" y1="260" x2="790" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#082C70"/>
